version: '3.8'

services:
  db:
    image: postgres:15
    container_name: delivery_service_db
    environment:
      POSTGRES_DB: delivery_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - delivery_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: delivery_service_web
    command: sh -c "python manage.py test && 
                    python manage.py migrate &&
                    python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_NAME=delivery_service_db
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=123
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy
    networks:
      - delivery_network

volumes:
  postgres_data:

networks:
  delivery_network:
    driver: bridge
